[project]
name = "devflow"
version = "0.1.0"
description = "Herramientas personales de automatización del flujo de desarrollo, construidas con LangGraph."
authors = [
    { name = "juampi", email = "juan-pablo.rodriguez@archipel.academy" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
]

[project.scripts]
start-branch = "devflow.start_branch.cli:main"
commit-message = "devflow.commit_message.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
